services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eplant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eplant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eplant}
      POSTGRES_DB: ${POSTGRES_DB:-eplant}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - eplant-db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eplant} -d ${POSTGRES_DB:-eplant}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: eplant-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  eplant-db-data:
