name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://eplant:eplant@localhost:5432/eplant?schema=public
          POSTGRES_USER: eplant
          POSTGRES_PASSWORD: eplant
          POSTGRES_DB: eplant
          JWT_ACCESS_SECRET: dev-access-secret-change-me-0123456789abcdef
          JWT_REFRESH_SECRET: dev-refresh-secret-change-me-0123456789abcdef
        continue-on-error: true
        run: |
          docker compose -f docker-compose.yml up -d --wait db || sleep 20
          npm run db:deploy || true
          npm run db:seed || true
          npm run test:e2e -w @eplant/api
          docker compose -f docker-compose.yml down db

      - name: Build Docker images
        continue-on-error: true
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/eplant-web:latest -f apps/web/Dockerfile .
          docker build -t ghcr.io/${{ github.repository_owner }}/eplant-api:latest -f apps/api/Dockerfile .

      - name: Log in to GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        continue-on-error: true
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/eplant-web:latest
          docker push ghcr.io/${{ github.repository_owner }}/eplant-api:latest

      - name: Deploy hint (optional)
        run: echo "🚀 Images are pushed. Deploy them with your favourite platform (Fly.io, Render, Railway, etc.)."
